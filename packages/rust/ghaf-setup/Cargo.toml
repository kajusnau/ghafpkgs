[workspace]
resolver = "3"
members = ["ghaf-setup-core", "ghaf-setup-ui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
async-trait = "0.1.89"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.17"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
